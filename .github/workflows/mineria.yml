# Minería automática en la nube (GitHub Actions)
# ==============================================
# Reemplaza la dependencia de la PC local: corre 3 veces al día aunque
# la notebook esté apagada. Cadena completa:
#   minería → score (RF02) → predicción de ML (Seccion 1.5.4) → alertas (HU02) → backup.
#
# La prediccion usa el modelo ya entrenado (ml/model.joblib, versionado en el
# repo); este workflow NO reentrena en cada corrida, solo corre predict.py
# sobre el estado actual. Reentrenar es una accion manual (python ml/train_model.py).
#
# Requiere 4 secrets en GitHub (Settings → Secrets and variables → Actions):
#   DATABASE_URL     → URL del POOLER de Supabase (aws-1-sa-east-1.pooler...)
#   DIRECT_URL       → misma URL del pooler
#   ML_APP_ID        → app de Mercado Libre
#   ML_CLIENT_SECRET → secret de la app
#
# IMPORTANTE: usar la URL del pooler (IPv4). Los runners de GitHub no tienen
# IPv6, igual que Render — la conexión directa db.*.supabase.co NO funciona.

name: Mineria de tendencias

on:
  schedule:
    # Cron en UTC. Argentina = UTC-3:
    - cron: "0 11 * * *"   # 08:00 ART
    - cron: "0 19 * * *"   # 16:00 ART
    - cron: "30 2 * * *"   # 23:30 ART
  workflow_dispatch: {}     # permite dispararla a mano para probar

concurrency:
  group: mineria
  cancel-in-progress: false

jobs:
  minar:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      ML_APP_ID: ${{ secrets.ML_APP_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Instalar dependencias de Node (incluye prisma generate)
        run: npm ci

      - name: Instalar dependencias de Python (ML)
        run: pip install -r ml/requirements.txt

      - name: Minería Carril 1 (protocolo humano)
        run: node scripts/mine_carril1.js

      - name: Calcular scores de tendencia (RF02)
        run: node scripts/compute_trend_scores.js --days=7

      - name: Exportar features actuales para el modelo de ML
        run: node scripts/export_latest_features.js > ml/latest_features.json

      - name: Predecir probabilidad de crecimiento (Seccion 1.5.4)
        run: python ml/predict.py

      - name: Guardar predicciones en MLPrediction
        run: node scripts/import_ml_predictions.js

      - name: Generar alertas de productos seguidos (HU02)
        run: node scripts/generate_alerts.js

      - name: Backup local de la base (RNF04)
        run: node scripts/backup_db.js

      - name: Publicar backup como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: backup-db-${{ github.run_id }}
          path: backups/db/*.json
          retention-days: 30
          if-no-files-found: warn
